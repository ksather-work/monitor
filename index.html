<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private email utility.">
<title>Comms Monitor</title>
<style>
:root{color-scheme:dark;--bg:#101113;--ink:#f5f5f5;--muted:#a9abb0;--line:#303238}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;padding:0 28px;margin:auto}
header{border-bottom:1px solid var(--line);padding:24px 0;font-size:15px;font-weight:650}
main{padding:118px 0 140px}
h1{font-size:clamp(36px,6vw,62px);line-height:1.1;letter-spacing:-.055em;font-weight:700;margin:0 0 22px}
p{color:var(--muted);max-width:550px;font-size:18px;margin:0}
a{color:var(--ink)}footer{border-top:1px solid var(--line);padding:25px 0 45px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}
footer a{color:var(--muted)}
@media(max-width:600px){main{padding:76px 0 100px}.wrap{padding:0 22px}}
</style>
</head>
<body>
<header><div class="wrap">Comms Monitor</div></header>
<main class="wrap">
<h1>Comms Monitor</h1>
<p>A private utility for organizing and reviewing email with the account owner's authorization.</p>
</main>
<footer><div class="wrap"><span>© 2026 Comms Monitor</span><span><a href="privacy.html">Privacy policy</a> · <a href="mailto:smileygeorge@gmail.com">Contact</a></span></div></footer>
</body>
</html>
